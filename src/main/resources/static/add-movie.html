<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie - Movie Watchlist</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/admin-dashboard.html">Movie Watchlist Admin</a>
        <div class="nav-links">
            <span class="nav-user">Signed in as <strong class="js-user-name">Admin</strong></span>
            <a href="#" onclick="logout(); return false;">Logout</a>
        </div>
    </nav>

    <div class="admin-layout">
        <aside class="sidebar">
            <h3>Admin Menu</h3>
            <a href="/admin-dashboard.html">Dashboard</a>
            <a class="active" href="/add-movie.html">Add Movie</a>
            <a href="/manage-movies.html">Manage Movies</a>
            <div class="sidebar-logout">
                <a href="#" onclick="logout(); return false;">Logout</a>
            </div>
        </aside>

        <main class="content">
            <div class="page-head">
                <div>
                    <h1>Add New Movie</h1>
                    <p>Fill in the movie details and optionally upload a poster.</p>
                </div>
                <a class="btn btn-secondary btn-small" href="/manage-movies.html">Back to Movies</a>
            </div>

            <div id="formAlert" class="alert"></div>

            <section class="panel narrow">
                <form id="addMovieForm" novalidate>
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" placeholder="Movie title" required>
                    </div>
                    <div class="form-group">
                        <label for="genre">Genre</label>
                        <input type="text" id="genre" name="genre" placeholder="e.g. Action, Drama, Sci-Fi" required>
                    </div>
                    <div class="form-group">
                        <label for="releaseDate">Release Date</label>
                        <input type="date" id="releaseDate" name="releaseDate" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Short description of the movie" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="poster">Movie Poster</label>
                        <input type="file" id="poster" name="poster" accept="image/*">
                        <p class="form-note">Optional. JPG, PNG, GIF or WEBP up to 5 MB.</p>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn" id="saveBtn">Save Movie</button>
                        <button type="reset" class="btn btn-secondary">Clear</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/add-movie.js"></script>
</body>
</html>
