<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - Movie Watchlist</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/index.html">Movie Watchlist</a>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a class="active" href="/user-login.html">User Login</a>
            <a href="/register.html">Register</a>
            <a href="/admin-login.html">Admin Login</a>
        </div>
    </nav>

    <main class="auth-wrap">
        <section class="auth-card">
            <h2>User Login</h2>
            <p class="subtitle">Log in to browse movies and manage your watchlist.</p>

            <div id="formAlert" class="alert"></div>

            <form id="userLoginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Your password" required>
                </div>
                <button type="submit" class="btn btn-block" id="loginBtn">Login</button>
            </form>

            <p class="auth-links">New here? <a href="/register.html">Create an account</a></p>
            <p class="auth-links"><a href="/admin-login.html">Administrator login</a></p>
        </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/user-login.js"></script>
</body>
</html>
