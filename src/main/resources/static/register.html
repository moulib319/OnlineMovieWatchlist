<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Movie Watchlist</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="/index.html">Movie Watchlist</a>
        <div class="nav-links">
            <a href="/index.html">Home</a>
            <a href="/user-login.html">User Login</a>
            <a class="active" href="/register.html">Register</a>
            <a href="/admin-login.html">Admin Login</a>
        </div>
    </nav>

    <main class="auth-wrap">
        <section class="auth-card">
            <h2>Create Account</h2>
            <p class="subtitle">Register to start building your movie watchlist.</p>

            <div id="formAlert" class="alert"></div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required>
                </div>
                <button type="submit" class="btn btn-block" id="registerBtn">Register</button>
            </form>

            <p class="auth-links">Already registered? <a href="/user-login.html">Login here</a></p>
        </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
