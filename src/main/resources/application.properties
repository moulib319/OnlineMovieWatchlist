spring.application.name=movie-watchlist
server.port=8080

# MySQL (isolated instance on port 3307)
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/movie_watchlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=movieapp
spring.datasource.password=MovieApp@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Default administrator account (created only if it does not exist)
app.admin.name=Administrator
app.admin.email=admin@9398moviewatchlist.com
